<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biscotto's Mod</title>

    <style>
        @font-face {
            font-family: "Coolvetica";
            src: url("coolvetica.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #1194f0;
            font-family: "Coolvetica", Arial, sans-serif;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .main {
            position: relative;
            z-index: 2;
            text-align: center;
            transform: translateY(-40px);
        }

        .logo {
            width: 220px;
            height: 220px;
            object-fit: contain;

            animation: spin 10s linear infinite;

            filter: drop-shadow(
                0 12px 18px rgba(0, 0, 0, 0.18)
            );
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .title {
            margin-top: 25px;

            font-size: 58px;
            font-weight: normal;

            letter-spacing: 1px;

            text-shadow:
                0 4px 12px rgba(0, 0, 0, 0.18);
        }

        .random-box {
            width: 520px;
            margin: 28px auto 0 auto;
        }

        .random-line {
            width: 100%;
            height: 2px;

            background:
                rgba(255, 255, 255, 0.30);
        }

        .random-text {
            margin-top: 14px;

            min-height: 24px;

            font-size: 18px;
            letter-spacing: 0.5px;

            color:
                rgba(255, 255, 255, 0.92);

            opacity: 1;

            transform: translateY(0);

            transition:
                opacity 0.35s ease,
                transform 0.35s ease;
        }

        .random-text.hidden {
            opacity: 0;
            transform: translateY(8px);
        }

        .loading-wrapper {
            position: absolute;

            left: 50%;
            bottom: 42px;

            transform: translateX(-50%);

            width: 72%;
            max-width: 950px;

            z-index: 3;
        }

        .loading-top {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 10px;

            font-size: 16px;
            letter-spacing: 0.5px;

            color:
                rgba(255, 255, 255, 0.92);
        }

        .status {
            max-width: 82%;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .percent {
            text-align: right;
        }

        .loading-bar-bg {
            width: 100%;
            height: 14px;

            background:
                rgba(255, 255, 255, 0.25);

            border-radius: 0;

            overflow: hidden;

            box-shadow: none;
        }

        .loading-bar {
            width: 0%;
            height: 100%;

            background: white;

            border-radius: 0;

            box-shadow: none;

            transition:
                width 0.4s ease;
        }

        .loading-bar.waiting {
            width: 25%;

            animation:
                waiting 1.8s ease-in-out infinite;
        }

        @keyframes waiting {
            0% {
                transform: translateX(-120%);
            }

            100% {
                transform: translateX(500%);
            }
        }

        @media (max-width: 768px) {
            .logo {
                width: 160px;
                height: 160px;
            }

            .title {
                font-size: 42px;
            }

            .random-box {
                width: 82vw;
            }

            .random-text {
                font-size: 16px;
            }

            .loading-wrapper {
                width: 86%;
            }

            .loading-top {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <img
            src="biscotto.png"
            alt="Biscotto Logo"
            class="logo"
        >

        <div class="title">
            Biscotto's Mod
        </div>

        <div class="random-box">

            <div class="random-line"></div>

            <div
                class="random-text"
                id="randomText"
            >
                Preparando i biscotti...
            </div>

        </div>

    </div>

    <div class="loading-wrapper">

        <div class="loading-top">

            <div
                class="status"
                id="status"
            >
                Connessione a Biscotto's Mod...
            </div>

            <div
                class="percent"
                id="percent"
            >
                ...
            </div>

        </div>

        <div class="loading-bar-bg">

            <div
                class="loading-bar waiting"
                id="loadingBar"
            ></div>

        </div>

    </div>

    <script>
        const randomMessages = [
            "Preparando i biscotti...",
            "Il Biscotto sta girando perfettamente...",
            "Inseguendo gli HeroGrey...",
            "ATTENZIONE: Hero è Gay, state lontano tende a toccare...",
            "Biscotto is watching you...",
            "Bun, Bun...",
            "EvilMarco ti guarda sempre, ricordalo...",
            "Sto cercando la torta...",
            "Teabaggando il killer...",
            "Premi ALT + F4 per un achievement segreto...",
            "Divertiti con gli amici belli...",
            "MAAASSSIIII MI PORRRTTII ALL MCCC...",
			"GG Bun, GG...",
			"Passando per il Covo Massi..."
        ];

        const randomText =
            document.getElementById("randomText");

        let lastMessage = -1;

        function changeRandomMessage() {
            randomText.classList.add("hidden");

            setTimeout(() => {
                let next;

                do {
                    next =
                        Math.floor(
                            Math.random() *
                            randomMessages.length
                        );
                }
                while (
                    next === lastMessage &&
                    randomMessages.length > 1
                );

                lastMessage = next;

                randomText.textContent =
                    randomMessages[next];

                randomText.classList.remove(
                    "hidden"
                );

            }, 350);
        }

        changeRandomMessage();

        setInterval(
            changeRandomMessage,
            3000
        );

        let totalFiles = 0;
        let filesNeeded = 0;

        const loadingBar =
            document.getElementById("loadingBar");

        const status =
            document.getElementById("status");

        const percent =
            document.getElementById("percent");

        function GameDetails(
            servername,
            serverurl,
            mapname,
            maxplayers,
            steamid,
            gamemode,
            volume,
            language
        ) {
            status.textContent =
                "Caricamento mappa: " +
                mapname;
        }

        function SetFilesTotal(total) {
            totalFiles = total;

            loadingBar.classList.remove(
                "waiting"
            );

            updateProgress();
        }

        function SetFilesNeeded(needed) {
            filesNeeded = needed;

            updateProgress();
        }

        function DownloadingFile(fileName) {
            status.textContent =
                "Download: " +
                fileName;
        }

        function SetStatusChanged(
            currentStatus
        ) {
            if (
                currentStatus &&
                currentStatus.length > 0
            ) {
                status.textContent =
                    currentStatus;
            }
        }

        function updateProgress() {
            if (totalFiles <= 0) {
                return;
            }

            const downloaded =
                totalFiles -
                filesNeeded;

            let progress =
                (
                    downloaded /
                    totalFiles
                ) * 100;

            progress =
                Math.max(
                    0,
                    Math.min(
                        100,
                        progress
                    )
                );

            loadingBar.style.width =
                progress + "%";

            percent.textContent =
                Math.floor(progress) +
                "%";
        }
    </script>

</body>
</html>
