<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Biscotto's Mod Schermata di Caricamento</title>

    <style>

        @font-face {
            font-family: "Coolvetica";
            src: url("coolvetica.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: "Coolvetica Book";
            src: url("coolvetica-book.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #1194f0;

            font-family:
                "Coolvetica Book",
                Arial,
                sans-serif;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .now-playing-wrapper {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 3;
            color: rgba(255, 255, 255, 0.92);
            letter-spacing: 0.5px;
        }

        .now-playing-label {
            font-family: "Coolvetica", Arial, sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .now-playing-title {
            font-size: 18px;
            font-weight: normal;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.18);
        }

        .main {
            position: relative;
            z-index: 2;

            text-align: center;

            transform:
                translateY(-20px);
        }

        .logo {
            width: 220px;
            height: 220px;

            object-fit: contain;

            animation:
                spin 10s
                linear
                infinite;

            filter:
                drop-shadow(
                    0 12px 18px
                    rgba(0, 0, 0, 0.18)
                );
        }

        @keyframes spin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }

        }

        .title {
            margin-top: 25px;

            font-family:
                "Coolvetica",
                Arial,
                sans-serif;

            font-size: 58px;
            font-weight: normal;

            letter-spacing: 1px;

            text-shadow:
                0 4px 12px
                rgba(0, 0, 0, 0.18);
        }

        .random-box {
            width: 520px;

            margin:
                28px
                auto
                0
                auto;
        }

        .random-line {
            width: 100%;
            height: 2px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.30
                );
        }

        .random-text {
            margin-top: 14px;

            min-height: 24px;

            font-size: 18px;

            letter-spacing:
                0.5px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.92
                );

            opacity: 1;

            transform:
                translateY(0);

            transition:
                opacity
                0.35s
                ease,

                transform
                0.35s
                ease;
        }

        .random-text.hidden {
            opacity: 0;

            transform:
                translateY(8px);
        }

        .loading-wrapper {
            position: absolute;

            left: 50%;
            bottom: 42px;

            transform:
                translateX(-50%);

            width: 72%;

            max-width:
                950px;

            z-index: 3;
        }

        .loading-top {
            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                10px;

            font-size:
                16px;

            letter-spacing:
                0.5px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.92
                );
        }

        .status {
            max-width: 82%;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }

        .percent {
            text-align:
                right;
        }

        .loading-bar-bg {
            width: 100%;

            height: 14px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

            border-radius: 0;

            overflow: hidden;

            box-shadow: none;
        }

        .loading-bar {
            width: 0%;

            height: 100%;

            background:
                white;

            border-radius: 0;

            box-shadow: none;

            transition:
                width
                0.4s
                ease;
        }

        .loading-bar.waiting {
            width: 25%;

            animation:
                waiting
                1.8s
                ease-in-out
                infinite;
        }

        @keyframes waiting {

            0% {
                transform:
                    translateX(-120%);
            }

            100% {
                transform:
                    translateX(500%);
            }

        }

        @media (max-width: 768px) {

            .logo {
                width: 160px;
                height: 160px;
            }

            .title {
                font-size: 42px;
            }

            .random-box {
                width: 82vw;
            }

            .random-text {
                font-size: 16px;
            }

            .loading-wrapper {
                width: 86%;
            }

            .loading-top {
                font-size: 14px;
            }

        }

    </style>

</head>


<body>

    <!-- ============================== -->
    <!-- ORA IN RIPRODUZIONE            -->
    <!-- ============================== -->

    <div class="now-playing-wrapper" id="nowPlayingWrapper">
        <div class="now-playing-label">Ora in riproduzione</div>
        <div class="now-playing-title" id="nowPlayingTitle">Nessuna traccia</div>
    </div>


    <!-- ============================== -->
    <!-- MUSICA DI SOTTOFONDO           -->
    <!-- ============================== -->

    <audio
        id="backgroundMusic"
        preload="auto"
    ></audio>


    <!-- ============================== -->
    <!-- CONTENUTO CENTRALE             -->
    <!-- ============================== -->

    <div class="main">

        <img
            src="biscotto.png"
            alt="Biscotto Logo"
            class="logo"
        >

        <div class="title">
            Biscotto's Mod
        </div>


        <div class="random-box">

            <div
                class="random-line"
            ></div>

            <div
                class="random-text"
                id="randomText"
            >
                Preparando i biscotti...
            </div>

        </div>

    </div>


    <!-- ============================== -->
    <!-- BARRA DI CARICAMENTO           -->
    <!-- ============================== -->

    <div class="loading-wrapper">

        <div class="loading-top">

            <div
                class="status"
                id="status"
            >
                Connessione a Biscotto's Mod...
            </div>

            <div
                class="percent"
                id="percent"
            >
                ...
            </div>

        </div>


        <div class="loading-bar-bg">

            <div
                class="loading-bar waiting"
                id="loadingBar"
            ></div>

        </div>

    </div>


    <script>

        /* ========================================= */
        /* MUSICA CASUALE                            */
        /* ========================================= */

        const backgroundMusic =
            document.getElementById(
                "backgroundMusic"
            );


        /*
            Volume iniziale.
        */

        backgroundMusic.volume = 0.35;


        /*
            Lista dei file audio presenti nella stessa cartella.
        */

        const musicFiles = [
            "DOORS Roblox OST Elevator Jam.mp3",
            "HeroGrey Non Piangere (Instrumental Remix).mp3",
            "Lethal Company - Boombox Song 5 (Official Extended).mp3",
            "Nintendo Wii - Mii Channel Theme.mp3",
            "Rick Astley - Never Gonna Give You Up (Instrumental).mp3",
            "Minecraft Music - Menu 1.mp3",
            "Shin Godzilla (2016) 04 - Early morning from Tokyo (short).mp3",
            "Fly Me to the Moon (Instrumental).mp3"
        ];


        let currentMusicIndex = -1;


        function playRandomMusic() {

            if (
                musicFiles.length === 0
            ) {

                return;

            }


            let nextIndex;


            do {

                nextIndex =
                    Math.floor(
                        Math.random() *
                        musicFiles.length
                    );

            }

            while (
                nextIndex === currentMusicIndex &&
                musicFiles.length > 1
            );


            currentMusicIndex =
                nextIndex;


            const fileName =
                musicFiles[currentMusicIndex];


            /*
                Rimuove l'estensione (.mp3) per il titolo visibile
            */

            const songTitle =
                fileName.replace(
                    /\.[^/.]+$/,
                    ""
                );


            document.getElementById(
                "nowPlayingTitle"
            ).textContent =
                songTitle;


            backgroundMusic.src =
                fileName;


            backgroundMusic
                .play()
                .catch(() => {

                    /*
                        Gestione blocco autoplay.
                    */

                });

        }


        backgroundMusic.addEventListener(
            "ended",
            playRandomMusic
        );


        function startMusic() {

            if (
                backgroundMusic.paused
            ) {

                if (
                    !backgroundMusic.src ||
                    backgroundMusic.src === window.location.href
                ) {

                    playRandomMusic();

                } else {

                    backgroundMusic
                        .play()
                        .catch(() => {});

                }

            }

        }


        startMusic();


        window.addEventListener(
            "load",
            () => {

                startMusic();

            }
        );


        document.addEventListener(
            "click",
            startMusic
        );

        document.addEventListener(
            "keydown",
            startMusic
        );


        /* ========================================= */
        /* MESSAGGI CASUALI                          */
        /* ========================================= */

        const randomMessages = [

            "Preparando i biscotti...",

            "Il Biscotto sta girando perfettamente...",

            "Inseguendo gli HeroGrey...",

            "ATTENZIONE: Hero è Gay, state lontano tende a toccare...",

            "Biscotto is watching you...",

            "Bun, Bun...",

            "EvilMarco ti guarda sempre, ricordalo...",

            "Sto cercando la torta...",

            "Teabaggando il killer...",

            "Premi ALT + F4 per un achievement segreto...",

            "Divertiti con gli amici belli...",

            "Passando per il Covo Massi...",

            "MAAASSSIIII MI PORRRTTII ALL MCCC...",

            "GG Bun, GG..."

        ];


        const randomText =
            document.getElementById(
                "randomText"
            );


        let lastMessage = -1;


        function changeRandomMessage() {

            randomText
                .classList
                .add("hidden");


            setTimeout(() => {

                let next;


                do {

                    next =
                        Math.floor(
                            Math.random() *
                            randomMessages.length
                        );

                }

                while (
                    next === lastMessage &&
                    randomMessages.length > 1
                );


                lastMessage =
                    next;


                randomText.textContent =
                    randomMessages[next];


                randomText
                    .classList
                    .remove("hidden");

            }, 350);

        }


        changeRandomMessage();


        setInterval(
            changeRandomMessage,
            3000
        );


        /* ========================================= */
        /* CARICAMENTO GARRY'S MOD                   */
        /* ========================================= */

        let totalFiles = 0;

        let filesNeeded = 0;


        const loadingBar =
            document.getElementById(
                "loadingBar"
            );


        const status =
            document.getElementById(
                "status"
            );


        const percent =
            document.getElementById(
                "percent"
            );


        /* ========================================= */
        /* GAME DETAILS                              */
        /* ========================================= */

        function GameDetails(
            servername,
            serverurl,
            mapname,
            maxplayers,
            steamid,
            gamemode,
            volume,
            language
        ) {

            status.textContent =
                "Caricamento mappa: " +
                mapname;


            let gameVolume =
                Number(volume);


            if (
                Number.isNaN(
                    gameVolume
                )
            ) {

                gameVolume =
                    0.35;

            }


            gameVolume =
                Math.max(
                    0,
                    Math.min(
                        1,
                        gameVolume
                    )
                );


            backgroundMusic.volume =
                gameVolume;


            if (
                gameVolume > 0
            ) {

                startMusic();

            }

        }


        /* ========================================= */
        /* FILE TOTALI                               */
        /* ========================================= */

        function SetFilesTotal(total) {

            totalFiles =
                Number(total) || 0;


            loadingBar
                .classList
                .remove(
                    "waiting"
                );


            updateProgress();

        }


        /* ========================================= */
        /* FILE RIMANENTI                            */
        /* ========================================= */

        function SetFilesNeeded(needed) {

            filesNeeded =
                Number(needed) || 0;


            updateProgress();

        }


        /* ========================================= */
        /* FILE IN DOWNLOAD                          */
        /* ========================================= */

        function DownloadingFile(
            fileName
        ) {

            status.textContent =
                "Download: " +
                fileName;

        }


        /* ========================================= */
        /* STATO GARRY'S MOD                         */
        /* ========================================= */

        function SetStatusChanged(
            currentStatus
        ) {

            if (
                currentStatus &&
                currentStatus.length > 0
            ) {

                status.textContent =
                    currentStatus;

            }

        }


        /* ========================================= */
        /* AGGIORNA BARRA                            */
        /* ========================================= */

        function updateProgress() {

            if (
                totalFiles <= 0
            ) {

                return;

            }


            const downloaded =
                totalFiles -
                filesNeeded;


            let progress =
                (
                    downloaded /
                    totalFiles
                ) * 100;


            progress =
                Math.max(
                    0,
                    Math.min(
                        100,
                        progress
                    )
                );


            loadingBar.style.width =
                progress +
                "%";


            percent.textContent =
                Math.floor(
                    progress
                ) +
                "%";

        }

    </script>

</body>

</html>
